server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: synchat-backend

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:synchat}
    username: ${POSTGRES_USER:synchat}
    password: ${POSTGRES_PASSWORD:synchat}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

app:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:change-me-access-secret-min-32-chars}
    refresh-secret: ${JWT_REFRESH_SECRET:change-me-refresh-secret-min-32-chars}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

  outbox:
    enabled: true
    batch-size: 50
    fixed-delay-ms: 1000

  notification:
    fcm:
      enabled: ${FCM_ENABLED:false}
      project-id: ${FIREBASE_PROJECT_ID:}
      dry-run: ${FCM_DRY_RUN:true}

logging:
  level:
    com.synchat.backend: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
