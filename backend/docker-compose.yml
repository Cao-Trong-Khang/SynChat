services:
  postgres:
    image: postgres:16
    container_name: synchat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: synchat
      POSTGRES_USER: synchat
      POSTGRES_PASSWORD: synchat
    ports:
      - "5432:5432"
    volumes:
      - synchat_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: synchat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  synchat_postgres_data: